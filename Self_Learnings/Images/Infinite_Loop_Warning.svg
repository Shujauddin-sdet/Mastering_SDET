<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="650" height="420" style="font-family:Arial,Helvetica,sans-serif">
  <rect width="650" height="420" fill="white"/>
  
  <!-- Title -->
  <text x="325" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#C62828">⚠️ Infinite Loop Warning</text>
  
  <defs>
    <marker id="ra" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D32F2F"/>
    </marker>
  </defs>
  
  <!-- ============ LEFT: The Problem ============ -->
  <rect x="20" y="55" width="290" height="35" rx="6" fill="#D32F2F"/>
  <text x="165" y="78" text-anchor="middle" fill="white" font-size="15" font-weight="bold">❌ The Problem</text>
  <rect x="20" y="90" width="290" height="190" fill="#FFEBEE" stroke="#FFCDD2" stroke-width="1"/>
  
  <!-- Circular loop -->
  <polygon points="165,120 225,155 165,190 105,155" fill="#FFCDD2" stroke="#EF5350" stroke-width="2"/>
  <text x="165" y="152" text-anchor="middle" font-size="11" fill="#C62828" font-weight="bold">while(true)</text>
  <text x="165" y="166" text-anchor="middle" font-size="10" fill="#C62828">ALWAYS true!</text>
  
  <rect x="115" y="205" width="100" height="30" rx="5" fill="#EF9A9A" stroke="#EF5350" stroke-width="1"/>
  <text x="165" y="225" text-anchor="middle" font-size="11" fill="#C62828" font-weight="bold">Execute code</text>
  
  <!-- Circular arrow -->
  <path d="M215 220 Q270 220 270 155 Q270 120 225 120" stroke="#D32F2F" stroke-width="2.5" fill="none" marker-end="url(#ra)"/>
  <text x="282" y="170" font-size="14" fill="#D32F2F" font-weight="bold">♾️</text>
  
  <line x1="165" y1="190" x2="165" y2="205" stroke="#D32F2F" stroke-width="2" marker-end="url(#ra)"/>
  
  <!-- Warning text -->
  <text x="80" y="260" font-size="12" fill="#C62828" font-weight="bold">1. Condition NEVER becomes false</text>
  <text x="80" y="278" font-size="12" fill="#C62828" font-weight="bold">2. Loop runs FOREVER</text>
  
  <!-- ============ RIGHT: The Fix ============ -->
  <rect x="340" y="55" width="290" height="35" rx="6" fill="#388E3C"/>
  <text x="485" y="78" text-anchor="middle" fill="white" font-size="15" font-weight="bold">✅ The Fix</text>
  <rect x="340" y="90" width="290" height="190" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>
  
  <polygon points="485,120 545,155 485,190 425,155" fill="#C8E6C9" stroke="#66BB6A" stroke-width="2"/>
  <text x="485" y="149" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold">count &lt; 10</text>
  <text x="485" y="165" text-anchor="middle" font-size="10" fill="#2E7D32">Will be false!</text>
  
  <rect x="435" y="205" width="100" height="30" rx="5" fill="#A5D6A7" stroke="#66BB6A" stroke-width="1"/>
  <text x="485" y="218" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold">Execute code</text>
  <text x="485" y="230" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold">count++ ✓</text>
  
  <line x1="485" y1="190" x2="485" y2="205" stroke="#388E3C" stroke-width="2"/>
  
  <text x="360" y="260" font-size="12" fill="#2E7D32" font-weight="bold">1. Condition WILL become false</text>
  <text x="360" y="278" font-size="12" fill="#2E7D32" font-weight="bold">2. Loop exits properly ✓</text>
  
  <!-- ============ BOTTOM: Code Examples ============ -->
  <rect x="20" y="295" width="290" height="110" rx="8" fill="#263238"/>
  <text x="35" y="315" font-size="11" fill="#EF5350" font-weight="bold">// ❌ BAD - Infinite Loop!</text>
  <text x="35" y="335" font-size="12" fill="#80CBC4" font-family="monospace">let x = 1;</text>
  <text x="35" y="355" font-size="12" fill="#80CBC4" font-family="monospace">while (x &gt; 0) {</text>
  <text x="35" y="375" font-size="12" fill="#FFAB91" font-family="monospace">  console.log(x);</text>
  <text x="35" y="395" font-size="12" fill="#80CBC4" font-family="monospace">} <tspan fill="#EF5350">// x is always &gt; 0!</tspan></text>
  
  <rect x="340" y="295" width="290" height="110" rx="8" fill="#263238"/>
  <text x="355" y="315" font-size="11" fill="#66BB6A" font-weight="bold">// ✅ GOOD - Has stop condition</text>
  <text x="355" y="335" font-size="12" fill="#80CBC4" font-family="monospace">let x = 1;</text>
  <text x="355" y="355" font-size="12" fill="#80CBC4" font-family="monospace">while (x &lt;= 10) {</text>
  <text x="355" y="375" font-size="12" fill="#FFAB91" font-family="monospace">  console.log(x);</text>
  <text x="355" y="395" font-size="12" fill="#80CBC4" font-family="monospace">  x++; <tspan fill="#66BB6A">// x will reach 11!</tspan></text>
</svg>
