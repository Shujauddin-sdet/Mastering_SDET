<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" style="font-family:Arial,Helvetica,sans-serif">
  <rect width="640" height="420" fill="white"/>
  <text x="320" y="35" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a2e">Array.entries() — Index AND Value Together</text>

  <defs>
    <marker id="ae" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Original Array -->
  <text x="100" y="68" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Original Array</text>
  <rect x="10" y="75" width="190" height="40" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>
  <text x="105" y="100" text-anchor="middle" font-size="13" font-family="monospace" fill="#1565C0" font-weight="bold">["Apple","Banana","Cherry"]</text>

  <!-- entries() arrow -->
  <line x1="200" y1="95" x2="245" y2="95" stroke="#555" stroke-width="2" marker-end="url(#ae)"/>
  <text x="222" y="88" text-anchor="middle" font-size="11" fill="#555">.entries()</text>

  <!-- entries() output -->
  <text x="390" y="68" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">What .entries() gives you</text>
  <rect x="250" y="75" width="180" height="40" rx="5" fill="#FFF9C4" stroke="#FDD835" stroke-width="1.5"/>
  <text x="340" y="100" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">[0, "Apple"]</text>
  <rect x="250" y="120" width="180" height="40" rx="5" fill="#FFF9C4" stroke="#FDD835" stroke-width="1.5"/>
  <text x="340" y="145" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">[1, "Banana"]</text>
  <rect x="250" y="165" width="180" height="40" rx="5" fill="#FFF9C4" stroke="#FDD835" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">[2, "Cherry"]</text>

  <!-- Split arrows to index/value -->
  <line x1="430" y1="95" x2="475" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#ae)"/>
  <line x1="430" y1="95" x2="475" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#ae)"/>
  <line x1="430" y1="140" x2="475" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#ae)"/>
  <line x1="430" y1="140" x2="475" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#ae)"/>
  <line x1="430" y1="185" x2="475" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#ae)"/>
  <line x1="430" y1="185" x2="475" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#ae)"/>

  <!-- Index boxes -->
  <rect x="475" y="65" width="75" height="30" rx="5" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="512" y="85" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="bold">index: 0</text>
  <rect x="475" y="110" width="75" height="30" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="512" y="130" text-anchor="middle" font-size="12" fill="#2E7D32" font-weight="bold">"Apple"</text>

  <rect x="475" y="115" width="75" height="28" rx="5" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="512" y="134" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="bold">index: 1</text>
  <rect x="475" y="148" width="75" height="28" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="512" y="167" text-anchor="middle" font-size="12" fill="#2E7D32" font-weight="bold">"Banana"</text>

  <rect x="475" y="160" width="75" height="28" rx="5" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="512" y="179" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="bold">index: 2</text>
  <rect x="475" y="193" width="75" height="28" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="512" y="212" text-anchor="middle" font-size="12" fill="#2E7D32" font-weight="bold">"Cherry"</text>

  <!-- Legend -->
  <rect x="560" y="70" width="65" height="25" rx="4" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="592" y="87" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="bold">index</text>
  <rect x="560" y="103" width="65" height="25" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="592" y="120" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">value</text>

  <!-- Code example -->
  <rect x="10" y="230" width="620" height="80" rx="8" fill="#263238"/>
  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#80CBC4" font-family="monospace">for (let [index, value] of fruits.entries()) {</text>
  <text x="320" y="277" text-anchor="middle" font-size="12" fill="#FFAB91" font-family="monospace">    console.log(index + ": " + value);</text>
  <text x="320" y="299" text-anchor="middle" font-size="12" fill="#80CBC4" font-family="monospace">}   // 0: Apple,  1: Banana,  2: Cherry</text>

  <!-- Bottom note -->
  <rect x="10" y="325" width="620" height="80" rx="10" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5"/>
  <text x="320" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">💡 When to Use This</text>
  <text x="320" y="373" text-anchor="middle" font-size="13" fill="#555">You want clean <tspan font-weight="bold">for...of</tspan> syntax BUT still need to know each item's <tspan font-weight="bold">position number</tspan>.</text>
  <text x="320" y="395" text-anchor="middle" font-size="13" fill="#6A1B9A" font-weight="bold">SDET: "Log Row 3 failed" instead of just "Row failed"</text>
</svg>
