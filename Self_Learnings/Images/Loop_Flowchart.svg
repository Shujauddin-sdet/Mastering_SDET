<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="600" height="550" style="font-family:Arial,Helvetica,sans-serif">
  <rect width="600" height="550" fill="white"/>
  
  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a2e">How a Loop Works</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976D2"/>
    </marker>
  </defs>
  
  <!-- Step 1: Start (Initialize) -->
  <rect x="200" y="55" width="200" height="45" rx="22" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <text x="300" y="83" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Start (Initialize)</text>
  
  <!-- Arrow: Start → Condition -->
  <line x1="300" y1="100" x2="300" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Condition Diamond -->
  <polygon points="300,145 420,215 300,285 180,215" fill="#FFC107" stroke="#F57F17" stroke-width="2"/>
  <text x="300" y="210" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Condition</text>
  <text x="300" y="228" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">true?</text>
  
  <!-- Arrow: Condition → Execute (Yes) -->
  <line x1="420" y1="215" x2="490" y2="215" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="205" fill="#388E3C" font-size="13" font-weight="bold">Yes ✓</text>
  
  <!-- Execute Code Block (right side) -->
  <rect x="400" y="280" width="170" height="50" rx="8" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="485" y="301" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Execute</text>
  <text x="485" y="319" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Code Block { }</text>
  
  <!-- Arrow: Yes path down to Execute -->
  <path d="M500 215 L500 280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Update box -->
  <rect x="400" y="365" width="170" height="45" rx="8" fill="#42A5F5" stroke="#1565C0" stroke-width="2"/>
  <text x="485" y="393" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Update (i++)</text>
  
  <!-- Arrow: Execute → Update -->
  <line x1="485" y1="330" x2="485" y2="365" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Loop back arrow: Update → Condition -->
  <path d="M400 387 L130 387 L130 215 L180 215" stroke="#1976D2" stroke-width="2.5" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowBlue)"/>
  <text x="105" y="310" fill="#1976D2" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90, 105, 310)">Loop Back ↺</text>
  
  <!-- Arrow: Condition → Exit (No) -->
  <line x1="300" y1="285" x2="300" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="330" fill="#D32F2F" font-size="13" font-weight="bold">No ✗</text>
  
  <!-- Exit circle -->
  <circle cx="300" cy="400" r="35" fill="#757575" stroke="#424242" stroke-width="2"/>
  <text x="300" y="396" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Exit</text>
  <text x="300" y="412" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Loop</text>

  <!-- Legend box -->
  <rect x="30" y="460" width="540" height="78" rx="10" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="1"/>
  <text x="300" y="485" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">🧩 The 3 Parts of a for loop</text>
  <rect x="50" y="495" width="12" height="12" fill="#2196F3" rx="2"/>
  <text x="70" y="506" font-size="13" fill="#333"><tspan font-weight="bold">Start</tspan> (let i = 0) → Where do we begin?</text>
  <rect x="230" y="495" width="12" height="12" fill="#FFC107" rx="2"/>
  <text x="250" y="506" font-size="13" fill="#333"><tspan font-weight="bold">Condition</tspan> (i &lt; 10) → Keep going?</text>
  <rect x="430" y="495" width="12" height="12" fill="#4CAF50" rx="2"/>
  <text x="450" y="506" font-size="13" fill="#333"><tspan font-weight="bold">Update</tspan> (i++) → +1</text>
  <text x="300" y="530" text-anchor="middle" font-size="12" fill="#666">for (let i = 0; i &lt; 10; i++) { ... }</text>
</svg>
