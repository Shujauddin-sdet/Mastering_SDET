<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" style="font-family:Arial,Helvetica,sans-serif">
  <rect width="640" height="400" fill="white"/>
  <text x="320" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">let vs var in Loops — Scope Gotcha</text>

  <!-- LEFT: var -->
  <rect x="20" y="55" width="285" height="35" rx="6" fill="#D32F2F"/>
  <text x="162" y="78" text-anchor="middle" fill="white" font-size="15" font-weight="bold">❌ var (Old Way — Avoid!)</text>
  <rect x="20" y="90" width="285" height="240" fill="#FFEBEE" stroke="#FFCDD2" stroke-width="1"/>

  <rect x="35" y="105" width="255" height="65" rx="5" fill="#263238"/>
  <text x="162" y="127" text-anchor="middle" font-size="11" fill="#EF9A9A" font-family="monospace">for (var i = 0; i &lt; 3; i++) {</text>
  <text x="162" y="147" text-anchor="middle" font-size="11" fill="#EF9A9A" font-family="monospace">    console.log(i);</text>
  <text x="60" y="164" font-size="11" fill="#EF9A9A" font-family="monospace">}</text>

  <!-- Leak arrow -->
  <text x="162" y="195" text-anchor="middle" font-size="13" fill="#C62828" font-weight="bold">⬇️ i LEAKS out of the loop!</text>
  <rect x="35" y="205" width="255" height="35" rx="5" fill="#FFCDD2" stroke="#EF5350" stroke-width="2"/>
  <text x="162" y="220" text-anchor="middle" font-size="12" font-family="monospace" fill="#C62828" font-weight="bold">console.log(i); // 3</text>
  <text x="162" y="236" text-anchor="middle" font-size="10" fill="#C62828">← Accessible AFTER loop ends!</text>

  <text x="162" y="268" text-anchor="middle" font-size="12" fill="#555">This causes bugs in callbacks</text>
  <text x="162" y="286" text-anchor="middle" font-size="12" fill="#555">and async code. Avoid!</text>
  <text x="162" y="310" text-anchor="middle" font-size="13" fill="#C62828" font-weight="bold">⚠️ Old style. Never use var.</text>

  <!-- RIGHT: let -->
  <rect x="335" y="55" width="285" height="35" rx="6" fill="#388E3C"/>
  <text x="477" y="78" text-anchor="middle" fill="white" font-size="15" font-weight="bold">✅ let (Modern Way)</text>
  <rect x="335" y="90" width="285" height="240" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1"/>

  <rect x="350" y="105" width="255" height="65" rx="5" fill="#263238"/>
  <text x="477" y="127" text-anchor="middle" font-size="11" fill="#A5D6A7" font-family="monospace">for (let i = 0; i &lt; 3; i++) {</text>
  <text x="477" y="147" text-anchor="middle" font-size="11" fill="#A5D6A7" font-family="monospace">    console.log(i);</text>
  <text x="375" y="164" font-size="11" fill="#A5D6A7" font-family="monospace">}</text>

  <!-- Blocked -->
  <text x="477" y="195" text-anchor="middle" font-size="13" fill="#2E7D32" font-weight="bold">🔒 i is TRAPPED inside { }</text>
  <rect x="350" y="205" width="255" height="35" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
  <text x="477" y="220" text-anchor="middle" font-size="12" font-family="monospace" fill="#C62828" font-weight="bold">console.log(i); // ❌ Error!</text>
  <text x="477" y="236" text-anchor="middle" font-size="10" fill="#2E7D32">← i does not exist here. Safe!</text>

  <text x="477" y="268" text-anchor="middle" font-size="12" fill="#555">Each loop iteration gets its</text>
  <text x="477" y="286" text-anchor="middle" font-size="12" fill="#555">own private copy of i.</text>
  <text x="477" y="310" text-anchor="middle" font-size="13" fill="#2E7D32" font-weight="bold">✅ Always use let in loops!</text>

  <!-- Bottom rule -->
  <rect x="20" y="344" width="600" height="45" rx="10" fill="#FFF8E1" stroke="#FFE082" stroke-width="1.5"/>
  <text x="320" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">📌 Golden Rule: Always use <tspan font-family="monospace" fill="#2E7D32">let</tspan> (or <tspan font-family="monospace" fill="#2E7D32">const</tspan>) — never <tspan font-family="monospace" fill="#D32F2F">var</tspan></text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#555">var is function-scoped (leaks). let is block-scoped (contained). let is always the right choice.</text>
</svg>
